<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A8"/>
      <stop offset="35%" stop-color="#C9A96E"/>
      <stop offset="70%" stop-color="#F5E8C7"/>
      <stop offset="100%" stop-color="#9B7A3E"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7A3E"/>
      <stop offset="50%" stop-color="#E8D5A8"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    <!-- Drop Shadow / Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C9A96E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(15, 12)" filter="url(#goldGlow)">
    <!-- Rounded Crest Container -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#14110E" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Stylized 'M' and 'V' with integrated Play triangle -->
    <!-- Letter M left leg -->
    <path d="M22 68 L22 32 L34 50 L46 32 L46 68" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Letter V overlay -->
    <path d="M48 44 L60 68 L72 44" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Play Triangle -->
    <path d="M64 28 L82 38 L64 48 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- LOGO TEXT: "MVplay" -->
  <g transform="translate(130, 78)">
    <!-- "MV" in bold luxury gold serif/sans hybrid -->
    <text x="0" y="0" font-family="'DM Sans', 'Cinzel', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" letter-spacing="1">MV</text>
    
    <!-- "play" in sleek modern white with dot -->
    <text x="76" y="0" font-family="'DM Sans', system-ui, sans-serif" font-weight="700" font-size="44" fill="#FFFFFF" letter-spacing="0.5">play</text>
    
    <!-- TV OTT Tagline -->
    <text x="3" y="20" font-family="'DM Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#C9A96E" letter-spacing="3.5">STREAMING &amp; IPTV</text>
  </g>
</svg>
